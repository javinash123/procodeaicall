# NIJVOX — Nginx configuration for Amazon Linux 2023
# Place this file at: /etc/nginx/conf.d/nijvox.conf
# (Remove or rename the default server block in /etc/nginx/nginx.conf if it conflicts)

server {
    listen 80;
    server_name nijvox.com www.nijvox.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nijvox.com www.nijvox.com;

    # --- SSL certificates (Let's Encrypt / Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/nijvox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nijvox.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Max upload size (for campaign document uploads)
    client_max_body_size 15M;

    # -------------------------------------------------------
    # CRITICAL: These two headers fix the 401 session issue.
    # Without X-Forwarded-Proto, Express does not know the
    # connection is HTTPS, and secure session cookies break.
    # -------------------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Required for Express trust-proxy + secure cookies
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Host              $host;

        # Required for WebSocket connections (/stream, /exotel-stream)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
